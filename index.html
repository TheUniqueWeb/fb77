<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Referrer Policy hide করার জন্য এই মেটা ট্যাগটি জরুরি -->
    <meta name="referrer" content="no-referrer">
    <title>Mobile Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; margin: 0; padding: 0; }
        .video-container {
            position: relative;
            width: 100%;
            /* ৫১০x৪০০ রেশিও অনুযায়ী হাইট */
            padding-bottom: 78.43%; 
            height: 0;
            background: #111;
            margin-bottom: 15px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }
    </style>
</head>
<body>

    <div class="max-w-md mx-auto">
        <!-- Video 1 -->
        <div class="video-container">
            <iframe 
                src="https://www.xnxx.com/embedframe/uecmkvvb033" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen="true"
                sandbox="allow-forms allow-scripts allow-pointer-lock allow-same-origin allow-top-navigation"
                referrerpolicy="no-referrer">
            </iframe>
        </div>

        <!-- Video 2 -->
        <div class="video-container">
            <iframe 
                src="https://www.xnxx.com/embedframe/opftmio1f38" 
                frameborder="0" 
                scrolling="no" 
                allowfullscreen="true"
                sandbox="allow-forms allow-scripts allow-pointer-lock allow-same-origin allow-top-navigation"
                referrerpolicy="no-referrer">
            </iframe>
        </div>
    </div>

    <script>
        // ভিডিও লোড না হলে অটো রিফ্রেশ বা মেসেজ দেখানোর জন্য
        window.onload = function() {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(f => {
                // কোনো এরর হলে কনসোলে দেখাবে
                f.onerror = function() {
                    console.log("Loading failed, check domain restrictions.");
                };
            });
        };
    </script>
</body>
</html>
