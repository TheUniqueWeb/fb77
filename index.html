<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Triple View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* স্ক্রিন নড়াচড়া করবে না */
            background-color: black;
        }
        .video-container {
            height: 33.33vh; /* স্ক্রিনকে সমান ৩ ভাগে ভাগ করা হয়েছে */
            width: 100%;
            border-bottom: 1px solid #333;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- ১ম ভিডিও -->
    <div class="video-container">
        <iframe src="https://www.xnxx.com/embedframe/iuhahkhca26" allowfullscreen></iframe>
    </div>

    <!-- ২য় ভিডিও -->
    <div class="video-container">
        <iframe src="https://www.xnxx.com/embedframe/okuikkv95f6" allowfullscreen></iframe>
    </div>

    <!-- ৩য় ভিডিও -->
    <div class="video-container">
        <iframe src="https://www.xnxx.com/embedframe/oittoth0473" allowfullscreen></iframe>
    </div>

</body>
</html>
