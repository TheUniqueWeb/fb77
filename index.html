<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Full Screen View</title>
    <style>
        /* পুরো স্ক্রিন ব্যবহার করার জন্য CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* স্ক্রল বন্ধ থাকবে */
            background-color: #000;
        }

        .container {
            display: flex;
            flex-direction: column; /* ভিডিওগুলো একটির নিচে আরেকটি থাকবে */
            width: 100vw;
            height: 100vh;
        }

        .video-wrapper {
            flex: 1; /* স্ক্রিনকে সমান দুই ভাগে ভাগ করবে */
            width: 100%;
            height: 50%;
            position: relative;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- প্রথম ভিডিও (উপরের অংশ) -->
        <div class="video-wrapper">
            <iframe src="https://www.xnxx.com/embedframe/okuihhk89f8" allowfullscreen="allowfullscreen"></iframe>
        </div>

        <!-- দ্বিতীয় ভিডিও (নিচের অংশ) -->
        <div class="video-wrapper">
            <iframe src="https://www.xnxx.com/embedframe/udioddf3e09" allowfullscreen="allowfullscreen"></iframe>
        </div>
    </div>

    <script>
        // স্ক্রিন সব সময় ফুল রাখার জন্য ছোট স্ক্রিপ্ট
        window.addEventListener("orientationchange", function() {
            window.location.reload();
        });
    </script>

</body>
</html>
